generation_seed: 42

net:
  net_path: data/grid_road/grid_road.sumocfg
  warehouse: center

tasks:
  # Used when gvrp.customer_sampling is density
  task_density: 30
  # Optional when gvrp.customer_sampling is count
  customer_count: 10

fleet:
  size: 2

gvrp:
  # customer_sampling: density | count
  customer_sampling: count
  customer_count: 5
  afs_count: 2

  # Units and physical model
  distance_unit: meters
  fuel_capacity: 7
  consumption_rate: 1 # gallons per mile
  speed_mph: 40.0
  max_duration_hours: 11.0
  customer_service_time_hours: 0.0   # zeroed for fast sanity checks
  refuel_time_hours: 0.0             # zeroed for fast sanity checks

  # Dummy node expansion
  afs_dummy_copies: 2
  depot_dummy_copies: 2

  # Runtime options
  plot: false
  run_single_vehicle_benchmark: false
  benchmark_target_distance_miles: 354.0
  benchmark_tolerance: 1e-3

solver:
  time_limit_seconds: 30
  output_flag: 0
  mip_gap: 0.05

# ── Heuristic EVRP planner (--planner heuristic) ─────────────────────────────
heuristic:
  alns_iterations: 300   # more iterations = better quality, longer runtime
  seed: 42               # remove or set to null for a time-based random seed

output:
  save_instance_json: generated_gvrp_instance.json

# ── SUMO simulation ──────────────────────────────────────────────────────────
sumo:
  step_length: 1.0        # simulation step in seconds
  traffic_scale: 0.0      # background vehicle density (0 = no background traffic)
  delay: 10              # ms GUI delay (used only when simulation.render_mode: human)

# ── Traffic model ─────────────────────────────────────────────────────────────
# Global piecewise-constant speed limit applied to all EVs.
# Mirrors the model in lmd_sumo.py.
traffic:
  enabled: true
  speed_limits: [20, 50]  # km/h  [min, max]
  speed_step: 10          # km/h
  seg_duration: 2         # minutes per segment
  seed: 42

# ── Simulation runtime ────────────────────────────────────────────────────────
simulation:
  max_time: 2             # hours (keep short for sanity checks)
  render_mode: quiet      # quiet | print | human
