# =============================================================================
# mtsp.yaml  —  MTSP baseline (KMeans clustering + nearest-neighbour TSP)
# =============================================================================
# Usage:  python run_sim.py -c config/mtsp.yaml --planner mtsp
#
# Inherits all shared settings from base.yaml.
# MTSP ignores fuel constraints — use as a fast distance/makespan baseline.

base: config/evrp/base.yaml

planner: mtsp

simulation:
  max_time: 12         # hours
  render_mode: print   # quiet | print | human
  runtime_refuel: true # when true, vehicles that lack range to reach the next
                       # stop AND return to depot will trackback to the depot,
                       # refuel, and resume. Vehicles always strand if they
                       # cannot reach the next stop regardless of this setting.

# MTSP has no planner-specific parameters.
# Override shared settings below if needed, e.g.:
#
# fleet:
#   size: 5
#
# simulation:
#   render_mode: human
