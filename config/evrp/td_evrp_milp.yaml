# =============================================================================
# td_evrp_milp.yaml  —  TDEVRP exact solver (Lu et al. 2020, cargo relaxed)
# =============================================================================
# Usage:  python run_sim.py -c config/evrp/td_evrp_milp.yaml --no-sim
#
# Formulation:
#   Three-level time-of-day speed profile: morning congestion [0, T1] at vc,
#   free-flow [T1, T2] with speed chosen from R = {v^1, ..., v^k}, evening
#   congestion [T2, u0] at vc. Travel times and energy are Ichoua-FIFO and
#   Franceschetti-flexible (α weight + β engine + γ speed). Cargo/demand is
#   relaxed: f_ij = 0 across all arcs (constraints 14, 15 dropped).
#   Requires a Gurobi license.

base: config/evrp/base.yaml

planner: td_evrp_milp

# Use meters internally — the Lu et al. energy/speed model works in SI.
# gvrp:
#   distance_unit: meters
#   customer_count: 5
#   afs_count: 2
#   afs_dummy_copies: 2
#   depot_dummy_copies: 2
#   max_duration_hours: 6.0     # sets u0 = Tmax · 3600 s

# ── Lu et al. time-of-day speed profile ──────────────────────────────────────
# vc applies during [0, T1] and [T2, u0]. During [T1, T2] the model picks a
# free-flow speed level from a uniform grid of num_speed_levels values in
# [v_congestion_kmh, v_freeflow_kmh].
# traffic_lu:
#   v_congestion_kmh: 15.0
#   v_freeflow_kmh: 50.0
#   num_speed_levels: 2
#   T1_hours: 1.0
#   T2_hours: 4.0

# ── Objective weights ────────────────────────────────────────────────────────
# Battery capacity and consumption rate come from gvrp.fuel_capacity /
# gvrp.consumption_rate (inherited from base.yaml). The planner converts
# consumption_rate (gal/mile) → gal/m internally to match SI distances.
# Tune w_energy / w_makespan to balance total-fuel (gal) vs makespan (s).
cost_model:
  w_energy: 0.0              # objective weight for total fuel term
  w_makespan: 1.0            # objective weight for makespan term

# ── Traffic model (overrides base.yaml) ──────────────────────────────────────
# Use the Lu et al. three-segment model so simulation matches the MILP speed profile.
# Parameters (vc, vf, T1, T2) are read from traffic_lu below.
traffic:
  enabled: true
  model: lu

# ── Simulation ───────────────────────────────────────────────────────────────
simulation:
  use_planned_wait_times: true   # honour departure_time - service_start_time

# ── Solver ────────────────────────────────────────────────────────────────────
solver:
  time_limit_seconds: 200
  mip_gap: 0.01
  output_flag: 1
