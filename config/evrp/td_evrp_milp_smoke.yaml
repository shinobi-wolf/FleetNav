# =============================================================================
# td_evrp_milp_smoke.yaml  —  TD-EVRP smoke config for restricted licenses
# =============================================================================
# Usage: python run_sim.py -c config/evrp/td_evrp_milp_smoke.yaml --no-sim
#
# This is intentionally smaller than td_evrp_milp.yaml to stay within
# size-limited Gurobi licenses while still exercising the full TD-EVRP path.

base: config/evrp/base.yaml

planner: td_evrp_milp

gvrp:
  distance_unit: meters
  customer_count: 2
  afs_count: 1
  afs_dummy_copies: 1
  depot_dummy_copies: 1
  max_duration_hours: 6.0

traffic_lu:
  v_congestion_kmh: 15.0
  v_freeflow_kmh: 50.0
  num_speed_levels: 2
  T1_hours: 1.0
  T2_hours: 4.0

cost_model:
  alpha: 0.27272
  beta: 33000.0
  gamma: 4.58339
  lambda_energy: 3.889e-8
  delta_wage: 0.0022
  mu_curb: 6350.0
  h_acquisition: 200.0
  energy_capacity_j: 7.2e7

solver:
  time_limit_seconds: 120
  mip_gap: 0.01
  output_flag: 1
