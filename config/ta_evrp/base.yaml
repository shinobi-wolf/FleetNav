# =============================================================================
# config/ta_evrp/base.yaml — shared TA-EVRP parameters
# =============================================================================
# Do not run this file directly. Child configs declare `base: config/ta_evrp/base.yaml`
# and override only what differs.
#
# Unit conventions (all physical quantities use human-friendly units here;
# the runner script converts to SI before passing to the package):
#   distances  → km
#   speeds     → km/h
#   times      → hours  (exceptions: step_length in s, delay in ms, time_limit_s in s)
#   fuel       → litres (L) and L/km

generation_seed: 42

# ── Outer Routing Planner (EVRP layer) ───────────────────────────────────────
evrp:
  planner: milp              # milp | heuristic | mtsp | td_milp

# ── Inner Navigation Agent (TRSP layer) ──────────────────────────────────────
trsp:
  agent: dijkstra            # dijkstra | dynamic_dijkstra | sarsa | dqn | a2c | ppo
  policy_id: null            # policy ID under runs/trsp/; required for RL agents

# ── Road Network ─────────────────────────────────────────────────────────────
network:
  net_path: data/rand_grid_road/rand_grid_road.sumocfg
  warehouse: center          # depot placement: center | random | <sumo node id>
  max_degree: 5              # max junction degree (used by TRSP obs space)

# ── Traffic Modeling ─────────────────────────────────────────────────────────
traffic:
  psl:                       # Piecewise Speed Limit model (per-edge random profile)
    enabled: true
    K: 1                     # number of time periods (1 = static speed per edge)
    v_min_kmh: 40.0          # km/h — minimum speed level
    v_max_kmh: 100.0         # km/h — maximum speed level
    speed_step_kmh: 60.0     # km/h — step between levels
    seed: 42
    profile_type: random     # random | function | file
  simulated:                 # SUMO background traffic
    vehicular:
      enabled: false
      scale: 0.0             # SUMO --scale factor (0 = empty roads)
    pedestrian:
      enabled: false

# ── UAV-assisted Battery Management System ───────────────────────────────────
uav_bms:
  enabled: false
  fleet_size: 2
  range_km: 5.0              # km

# ── UGV Fleet & Delivery Task Parameters ─────────────────────────────────────
simulation:
  ugv:
    fleet_size: 3
    battery_capacity_L: 15       # litres of fuel/energy on a full charge
    consumption_rate_L_per_km: 1  # L/km  →  range = 50 / 5 = 10 km
    free_flow_speed_kmh: 110     # km/h  (= 120 mph)
    max_duration_h: 6.0             # hours — hard route time limit
    customer_service_time_h: 0      # hours — dwell time at each customer stop
    recharge_time_h: 0              # hours — dwell time at each AFS stop
    runtime_refuel: false           # trackback to depot when next stop is out of range
  tasks:
    customer_count: 10
    afs_count: 3
    customer_sampling: count        # count | density
    task_density: 30                # % of nodes (used when sampling: density)

# ── SUMO Process ─────────────────────────────────────────────────────────────
sumo:
  step_length: 1.0               # seconds
  simulator: concurrent          # sequential | concurrent
  max_time_h: 12                 # hours — SUMO wall-clock budget
  render_mode: print             # quiet | print | human
  delay: 5                       # ms GUI delay (human mode only)

# ── Output ───────────────────────────────────────────────────────────────────
output:
  plot: true
  save_instance_json: true
  save_metrics_json: true
