# =============================================================================
# config/ta_evrp/heuristic_sarsa.yaml — ALNS outer plan + SARSA inner navigation
# =============================================================================
# Full TA-EVRP: traffic-aware PSL model, SARSA RL agent navigates each leg.
# Requires a trained SARSA policy under runs/trsp/<policy_id>/.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/heuristic_sarsa.yaml

base: config/ta_evrp/base.yaml

evrp:
  planner: heuristic

trsp:
  agent: sarsa
  policy_id: ff58b1a9            # set to the policy ID, e.g. "77a4169c"

