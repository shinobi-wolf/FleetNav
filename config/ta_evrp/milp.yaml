# =============================================================================
# config/ta_evrp/milp.yaml — MILP exact planner, static Dijkstra navigation
# =============================================================================
# Pure EVRP mode: traffic-agnostic outer plan + static shortest-path inner nav.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/milp.yaml

base: config/ta_evrp/base.yaml

evrp:
  planner: milp
  milp:
    time_limit_s: 300        # seconds — Gurobi wall-clock limit
    mip_gap: 0.01            # 0.0 = proven optimal
    output_flag: 1           # 0 = silent, 1 = verbose Gurobi log
    afs_dummy_copies: 3
    depot_dummy_copies: 3

trsp:
  agent: dijkstra
