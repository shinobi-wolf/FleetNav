# =============================================================================
# config/ta_evrp/milp_dqn_ped.yaml — MILP outer plan + DQN-PED navigation
# =============================================================================
# Delivery robot walks each leg on sidewalks under a DQN policy trained on the
# pedestrian (Weidmann) traffic model (obs = neighbour sidewalk speeds).
# Requires runs/trsp/<policy_id>/.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/milp_dqn_ped.yaml

base: config/ta_evrp/ped_base.yaml

evrp:
  planner: milp
  milp:
    time_limit_s: 300
    mip_gap: 0.01
    output_flag: 1
    afs_dummy_copies: 3
    depot_dummy_copies: 3

trsp:
  agent: dqn_ped
  policy_id: 962999ce
