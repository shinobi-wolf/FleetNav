# =============================================================================
# config/ta_evrp/milp_sarsa.yaml — MILP outer plan + SARSA inner navigation
# =============================================================================
# Full TA-EVRP: traffic-aware PSL model, SARSA RL agent navigates each leg.
# Requires a trained SARSA policy under runs/trsp/<policy_id>/.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/milp_sarsa.yaml

base: config/ta_evrp/base.yaml

evrp:
  planner: milp
  milp:
    time_limit_s: 300        # seconds — Gurobi wall-clock limit
    mip_gap: 0.01            # 0.0 = proven optimal
    output_flag: 1           # 0 = silent, 1 = verbose Gurobi log
    afs_dummy_copies: 3
    depot_dummy_copies: 3

trsp:
  agent: sarsa
  policy_id: 44a88465            # set to the policy ID, e.g. "77a4169c"

