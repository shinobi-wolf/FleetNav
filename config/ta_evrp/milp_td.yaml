# =============================================================================
# config/ta_evrp/milp_td.yaml — Time-Dependent EVRP MILP
# =============================================================================
# Traffic-aware outer planner using Ichoua FIFO travel-time model with PSL.
# Known limitations: LP relaxation bound always 0; speed-independent energy model.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/milp_td.yaml --no-sim

base: config/ta_evrp/base.yaml

evrp:
  planner: td_milp

trsp:
  agent: dijkstra

traffic:
  psl:
    enabled: true
    K: 6
    v_min: 15.0
    v_max: 50.0
    speed_step: 5.0

# Objective weights
cost_model:
  w_energy: 0.0
  w_makespan: 1.0
