# =============================================================================
# config/ta_evrp/mtsp.yaml — mTSP baseline (ignores fuel constraints)
# =============================================================================
# Usage: python infer_ta_evrp.py -c config/ta_evrp/mtsp.yaml

base: config/ta_evrp/base.yaml

evrp:
  planner: mtsp

trsp:
  agent: dqn_svc
  policy_id: 2553013e

simulation:
  ugv:
    runtime_refuel: true   # mTSP ignores fuel — runtime refuel prevents stranding

sumo:
  render_mode: print
