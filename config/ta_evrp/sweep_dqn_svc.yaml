# =============================================================================
# config/ta_evrp/sweep_dqn_svc.yaml — dqn_svc policy sweep across all networks
# =============================================================================
# 3 planners × 3 (network + svc traffic + policy) = 9 combinations
#
# _zip_ groups move together as paired rows instead of cartesian-expanding.
# Each row in values corresponds to one network with its matched route file,
# traffic scale, and trained dqn_svc policy_id.

base: config/ta_evrp/base.yaml

# # ── Fixed scalars ─────────────────────────────────────────────────────────────
# trsp:
#   agent: [dijkstra,]

traffic:
  model: svc

# ── Independent sweep axes ────────────────────────────────────────────────────
evrp:
  planner: [milp, heuristic, mtsp]

# ── Zip group: network + SVC traffic + trained policy (move together) ─────────
_zip_:
  - keys: [network.net_path, traffic.svc.route_file, traffic.svc.traffic_scale, trsp.agent, trsp.policy_id]
    values:
      - [data/grid_road/grid_road.sumocfg,                 data/grid_road/traffic_routes/svc_42/rvt_routes.xml,      1.5, dijkstra, ~]
      - [data/grid_road/grid_road.sumocfg,                 data/grid_road/traffic_routes/svc_42/rvt_routes.xml,      1.5, dsp, ~]
      - [data/grid_road/grid_road.sumocfg,                 data/grid_road/traffic_routes/svc_42/rvt_routes.xml,      1.5, dqn_svc, 19acc44f]
      - [data/rand_grid_road/rand_grid_road_final.sumocfg, data/rand_grid_road/traffic_routes/svc_42/rvt_routes.xml, 2.5, dijkstra, ~]
      - [data/rand_grid_road/rand_grid_road_final.sumocfg, data/rand_grid_road/traffic_routes/svc_42/rvt_routes.xml, 2.5, dsp, ~]
      - [data/rand_grid_road/rand_grid_road_final.sumocfg, data/rand_grid_road/traffic_routes/svc_42/rvt_routes.xml, 2.5, dqn_svc, 2553013e]
      - [data/ames/ames_campus_final.sumocfg,              data/ames/traffic_routes/svc_42/rvt_routes.xml,           2.0, dijkstra, ~]
      - [data/ames/ames_campus_final.sumocfg,              data/ames/traffic_routes/svc_42/rvt_routes.xml,           2.0, dsp, ~]
      - [data/ames/ames_campus_final.sumocfg,              data/ames/traffic_routes/svc_42/rvt_routes.xml,           2.0, dqn_svc, 964ad609]