# =============================================================================
# config/ta_evrp/sweep_raps.yaml — full sweep with RAPS enabled
# =============================================================================
# All EVRP planners × all TRSP agents × all traffic models × all 3 networks
# × all PSL K values, with Range-Aware Path Switching (RAPS) active throughout.
#
# PSL and SVC rows live in ONE zip group (the runner does itertools.product
# across all axes; two zip groups would cross-multiply PSL × SVC).
# Keys not used by a row are set to null (~).
#
# PSL slot_duration: K=2 → 300 s;  K=1,3,4 → 60 s
#
# Count:
#   PSL rows: 4 K values × 3 networks × 6 agents (dijkstra, dsp, sarsa, dqn, a2c, ppo) = 72
#   SVC rows: 3 networks × 6 agents (dijkstra, dsp, sarsa_svc, dqn_svc, a2c_svc, ppo_svc) = 18
#   zip total: 90 rows
#   EVRP planners (independent axis): 3  (milp, heuristic, mtsp)
#   Total: 90 × 3 = 270 runs

base: config/ta_evrp/base.yaml

# ── Fixed scalar ──────────────────────────────────────────────────────────────
trsp:
  raps_enabled: true

# ── Independent sweep axis ────────────────────────────────────────────────────
evrp:
  planner: [milp, heuristic]

# ── Single zip group: PSL rows (K=1–4) then SVC rows ─────────────────────────
# Keys: traffic.model | traffic.psl.K | traffic.psl.slot_duration
#       | traffic.svc.route_file | traffic.svc.traffic_scale
#       | network.net_path | trsp.agent | trsp.policy_id
#
# PSL rows: route_file=~, traffic_scale=~
# SVC rows: K=~, slot_duration=~
_zip_:
  - keys: [traffic.model, traffic.psl.K, traffic.psl.slot_duration, traffic.svc.route_file, traffic.svc.traffic_scale, network.net_path, trsp.agent, trsp.policy_id]
