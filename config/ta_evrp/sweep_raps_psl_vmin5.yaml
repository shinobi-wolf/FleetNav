# =============================================================================
# config/ta_evrp/sweep_raps_psl_vmin5.yaml — PSL-only, dijkstra+dqn, v_min=5
# =============================================================================
# Variant of sweep_raps.yaml: PSL traffic only (no SVC), agents restricted to
# {dijkstra, dqn}, RAPS still on. Widens the PSL speed range from the base
# {40, 100} km/h to {5, 100} km/h — v_min_kmh/v_max_kmh/speed_step_kmh are
# fixed scalar overrides applied to every combo.
#
# speed_step_kmh: 95.0 = v_max - v_min, preserving the original two-level
# design ({v_min, v_max} exactly) instead of the default 60.0 (which would
# only reach {5, 65} and never touch 100 km/h).
#
# Existing trained DQN policies (trained under v_min=40) are reused as-is —
# this is a generalization test under a widened speed range, not a retrain.
#
# Count: 4 K values x 3 networks x 2 agents = 24 zip rows x 3 planners = 72 runs

base: config/ta_evrp/base.yaml

# ── Fixed scalar overrides ────────────────────────────────────────────────────
trsp:
  raps_enabled: true

traffic:
  psl:
    v_min_kmh: 5.0
    v_max_kmh: 60.0
    speed_step_kmh: 55.0

# ── Independent sweep axis ────────────────────────────────────────────────────
evrp:
  planner: [milp, heuristic]

# ── Single zip group: PSL rows (K=1-4), dijkstra + dqn only ──────────────────
# Keys: traffic.model | traffic.psl.K | traffic.psl.slot_duration
#       | traffic.svc.route_file | traffic.svc.traffic_scale
#       | network.net_path | trsp.agent | trsp.policy_id
_zip_:
  - keys: [traffic.model, traffic.psl.K, traffic.psl.slot_duration, traffic.svc.route_file, traffic.svc.traffic_scale, network.net_path, trsp.agent, trsp.policy_id]
    values:
      # ── PSL / K=1 (slot_duration=60s) ───────────────────────────────────────
      - [psl, 1, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dijkstra, ~        ]
      - [psl, 1, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dqn,      5b6c4910 ]
      - [psl, 1, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dijkstra, ~        ]
      - [psl, 1, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dqn,      9a9355f4 ]
      - [psl, 1, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dijkstra, ~        ]
      - [psl, 1, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dqn,      a4f68fc2 ]
      # ── PSL / K=2 (slot_duration=300s) ──────────────────────────────────────
      - [psl, 2, 300, ~, ~, data/grid_road/grid_road.sumocfg,                 dijkstra, ~        ]
      - [psl, 2, 300, ~, ~, data/grid_road/grid_road.sumocfg,                 dqn,      506a3be8 ]
      - [psl, 2, 300, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dijkstra, ~        ]
      - [psl, 2, 300, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dqn,      4a2adb07 ]
      - [psl, 2, 300, ~, ~, data/ames/ames_campus_final.sumocfg,              dijkstra, ~        ]
      - [psl, 2, 300, ~, ~, data/ames/ames_campus_final.sumocfg,              dqn,      cf474f44 ]
      # ── PSL / K=3 (slot_duration=60s) ───────────────────────────────────────
      - [psl, 3, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dijkstra, ~        ]
      - [psl, 3, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dqn,      e07d1340 ]
      - [psl, 3, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dijkstra, ~        ]
      - [psl, 3, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dqn,      e7ead959 ]
      - [psl, 3, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dijkstra, ~        ]
      - [psl, 3, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dqn,      87d6b298 ]
      # ── PSL / K=4 (slot_duration=60s) ───────────────────────────────────────
      - [psl, 4, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dijkstra, ~        ]
      - [psl, 4, 60, ~, ~, data/grid_road/grid_road.sumocfg,                 dqn,      75c5a644 ]
      - [psl, 4, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dijkstra, ~        ]
      - [psl, 4, 60, ~, ~, data/rand_grid_road/rand_grid_road_final.sumocfg, dqn,      63627279 ]
      - [psl, 4, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dijkstra, ~        ]
      - [psl, 4, 60, ~, ~, data/ames/ames_campus_final.sumocfg,              dqn,      aa120033 ]
