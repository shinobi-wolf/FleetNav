# =============================================================================
# config/ta_evrp/td_milp.yaml — Time-Dependent MILP planner (Lu et al. 2020)
# =============================================================================
# TD-EVRP: the milp G-VRP exact planner with departure-time-dependent travel
# time over a three-period congestion profile. Pairs the td_milp planner with
# the matching `td` traffic model so the plan and the SUMO simulation use the
# same v_c / v_f speeds and T1 / T2 boundaries.
# Usage: python infer_ta_evrp.py -c config/ta_evrp/td_milp.yaml
#        python infer_ta_evrp.py -c config/ta_evrp/td_milp.yaml --no-sim   # plan only

base: config/ta_evrp/base.yaml

evrp:
  planner: td_milp
  td_milp:
    time_limit_s: 300        # seconds — Gurobi wall-clock limit
    mip_gap: 0.01            # 0.0 = proven optimal
    output_flag: 1           # 0 = silent, 1 = verbose Gurobi log
    afs_dummy_copies: 3
    depot_dummy_copies: 3
    # Objective = w_makespan * makespan_s + w_distance * distance_m.
    # Makespan is primary — it is the metric the congestion profile informs and
    # where td_milp beats milp/heuristic. Set w_makespan: 0 for pure min-distance.
    w_makespan: 1.0
    w_distance: 0.001        # light regulariser to keep equal-makespan routes tidy

