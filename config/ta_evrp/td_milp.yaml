# Time-dependent traffic — read by BOTH the planner and the Simulator.
traffic:
  model: td
  td:
    enabled: true
    v_congestion_kmh: 10.0   # slots 0 & 2 (morning / evening peak)
    v_freeflow_kmh: 40.0     # slot 1 (midday free-flow)
    T1_hours: 0.0277778            # 0 < T1 < T2 < simulation.ugv.max_duration_h (6 h)
    T2_hours: 0.0555556

