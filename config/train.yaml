fleet:
  max_speed: 5
debug:
  delay: 200
  fast_forward: 0
net:
  net_path: data/grid/grid.sumocfg
  max_degree: 4
simulation:
  max_time: 10000
  max_steps: 50
  traffic_scale: 1
  step_length: 3
  render_mode: quiet
  render_fps: 30
agent:
  algo: sarsa
training:
  sarsa:
    num_episodes: 5000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.2
    epsilon_decay: 0.99
  dqn:
    pred_epsilon: 0.1
    learning_rate: 2.5e-3
    buffer_size: 10000
    total_timesteps: 1000000
    start_e: 1
    end_e: 0.05
    exploration_fraction: 0.5
    learning_starts: 10000
    train_frequency: 10
    batch_size: 128
    gamma: 0.99
    target_network_frequency: 500
    tau: 1.0