debug:
  fast_forward: 100
fleet:
  count: 1
  range: 100000000
  max_speed: 1
net:
  net_path: data/grid/grid.sumocfg
  warehouse: random
simulation:
  max_time: 5000
  max_steps: 1000
  render_mode: quiet
  render_fps: 30
  step_length: 1
  train: true
task:
  demand_per: 60
traffic:
  p:default
  b:default
agent:
  algo: sarsa
training:
  sarsa:
    num_episodes: 2000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.2
    epsilon_decay: 0.99
  dqn:
    pred_epsilon: 0.1
    learning_rate: 2.5e-3
    buffer_size: 10000
    total_timesteps: 1000000
    start_e: 1
    end_e: 0.05
    exploration_fraction: 0.5
    learning_starts: 10000
    train_frequency: 10
    batch_size: 128
    gamma: 0.99
    target_network_frequency: 500
    tau: 1.0