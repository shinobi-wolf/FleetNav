maze:
  cell_size: 50
  map: data/road_grid/road_grid.sumocfg

task:
  num_tasks: 5000

fleet:
  count: 1
  drain_rate: 1
  num_primitives: 5
  range: 1000000
  speed: 1

traffic:
  delay_factor: 10
  num_centroids: 5
  prob: 0.8
  reset_dur: 1
  std_dev: 150

simulation:
  max_time: 50000
  traffic: true
  algo: sarsa
  render_mode: quiet
  train: true
  render_fps: 30

training:
  sarsa:
    num_episodes: 3000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.2
    epsilon_decay: 0.99
  dqn:
    pred_epsilon: 0.1
    learning_rate: 2.5e-3
    buffer_size: 10000
    total_timesteps: 1000000
    start_e: 1
    end_e: 0.05
    exploration_fraction: 0.5
    learning_starts: 10000
    train_frequency: 10
    batch_size: 128
    gamma: 0.99
    target_network_frequency: 500
    tau: 1.0

debug:
  fast_forward: 0
  manual_control: false