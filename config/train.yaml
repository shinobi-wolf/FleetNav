agent:
  algo: sarsa
sumo:
  delay: 0
  traffic_scale: 1
  step_length: 1
fleet:
  max_speed: 5
  range: 100000000
net:
  max_degree: 4
  net_path: data/grid_road/grid_road.sumocfg
simulation:
  max_time: 15000
  max_steps: 50
  render_mode: quiet
  warm_up_time: 2000
  random_sg_pair: true
  start_node_idx: 0
  target_junc_id: '1'
  vehicle_type: 'car'
training:
  sarsa:
    num_episodes: 5000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.2
    epsilon_decay: 0.99
  dqn:
    pred_epsilon: 0.1
    learning_rate: 2.5e-3
    buffer_size: 10000
    total_timesteps: 1000000
    start_e: 1
    end_e: 0.05
    exploration_fraction: 0.5
    learning_starts: 10000
    train_frequency: 10
    batch_size: 128
    gamma: 0.99
    target_network_frequency: 500
    tau: 1.0
  ppo:
    total_timesteps: 500000
    learning_rate: 2.5e-4
    num_steps: 128
    anneal_lr: true
    gamma: 0.99
    gae_lambda: 0.95
    num_minibatches: 4
    update_epochs: 4
    norm_adv: true
    clip_coef: 0.2
    clip_vloss: true
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: null
    # to be filled in runtime
    batch_size: 0
    minibatch_size: 0
    num_iterations: 0