net:
  net_path: data/rand_grid_road/rand_grid_road_final.sumocfg
  max_degree: 5

fleet:
  max_speed: 110          # km/h

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

traffic:
  K: 1
  slot_duration: 300.0
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  speed_step: 60.0
  v_max: 100.0
  v_min: 40.0

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

agent:
  algo: a2c
  action_mode: node_id
  policy: null

training:
  a2c:
    num_iterations: 100
    num_steps: 512
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lr: 7.0e-4
    anneal_lr: false
    hidden_dim: 64
    save_interval: 50
