net:
  net_path: data/ames/ames_campus_final.sumocfg
  max_degree: 5

fleet:
  max_speed: 110

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

traffic:
  K: 3
  slot_duration: 60.0
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  speed_step: 60.0
  v_max: 100.0
  v_min: 40.0

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

agent:
  algo: dqn
  action_mode: node_id
  policy: null

training:
  dqn:
    num_episodes: 5000
    gamma: 0.99
    lr: 0.001
    epsilon: 1.0
    epsilon_decay: 0.9995
    epsilon_min: 0.05
    batch_size: 64
    buffer_capacity: 50000
    target_update_freq: 500
    learn_start: 1000
    hidden_dim: 64
