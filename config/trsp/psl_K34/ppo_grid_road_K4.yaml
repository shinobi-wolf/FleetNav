net:
  net_path: data/grid_road/grid_road.sumocfg
  max_degree: 5

fleet:
  max_speed: 110

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

traffic:
  K: 4
  slot_duration: 60.0
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  speed_step: 60.0
  v_max: 100.0
  v_min: 40.0

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

agent:
  algo: ppo
  action_mode: node_id
  policy: null

training:
  ppo:
    num_iterations: 100
    num_steps: 512
    update_epochs: 4
    num_minibatches: 4
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lr: 2.5e-4
    anneal_lr: true
    hidden_dim: 64
    save_interval: 50
