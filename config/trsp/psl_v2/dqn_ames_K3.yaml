# PSL dqn — ames, K=3 (lane-speed bug fixed: 30 m/s lanes). Two levels {10,100} km/h.
net:
  net_path: data/ames/ames_campus_final.sumocfg
  max_degree: 5

fleet:
  max_speed: 110            # km/h

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

traffic:
  model: psl
  K: 3
  slot_duration: 60.0
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  v_min: 10.0               # km/h
  v_max: 100.0              # km/h
  speed_step: 90.0          # km/h -> exactly two levels {10, 100}

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

agent:
  algo: dqn
  action_mode: node_id
  policy: null

training:
  dqn:
    num_episodes: 5000
    gamma: 0.99
    lr: 0.001
    epsilon: 1.0
    epsilon_decay: 0.9995
    epsilon_min: 0.05
    batch_size: 64
    buffer_capacity: 50000
    target_update_freq: 500
    learn_start: 1000
    hidden_dim: 64
