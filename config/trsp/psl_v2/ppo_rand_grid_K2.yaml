# PSL ppo — rand_grid, K=2 (lane-speed bug fixed: 30 m/s lanes). Two levels {10,100} km/h.
net:
  net_path: data/rand_grid_road/rand_grid_road_final.sumocfg
  max_degree: 5

fleet:
  max_speed: 110            # km/h

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

traffic:
  model: psl
  K: 2
  slot_duration: 300.0
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  v_min: 10.0               # km/h
  v_max: 100.0              # km/h
  speed_step: 90.0          # km/h -> exactly two levels {10, 100}

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

agent:
  algo: ppo
  action_mode: node_id
  policy: null

training:
  ppo:
    num_iterations: 100
    num_steps: 512
    update_epochs: 4
    num_minibatches: 4
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lr: 2.5e-4
    anneal_lr: true
    hidden_dim: 64
    save_interval: 50
