net:
  net_path: data/ames/ames_campus_final.sumocfg
  max_degree: 5

fleet:
  max_speed: 110

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

traffic:
  T1: 100
  T2: 200
  T: 300
  enabled: true
  model: td
  seed: 42
  v_congestion: 10.0
  v_freeflow: 40.0

agent:
  algo: dqn
  action_mode: node_id
  policy: null

training:
  dqn:
    num_episodes: 5000
    gamma: 0.99
    lr: 0.001
    epsilon: 1.0
    epsilon_decay: 0.9995
    epsilon_min: 0.05
    batch_size: 64
    buffer_capacity: 50000
    target_update_freq: 500
    learn_start: 1000
    hidden_dim: 64
