net:
  net_path: data/grid_road/grid_road.sumocfg
  max_degree: 5

fleet:
  max_speed: 110

sumo:
  step_length: 1.0
  traffic_scale: 0
  delay: 0

simulation:
  max_time: 2
  max_steps: 50
  render_mode: quiet
  warm_up_time: 0
  random_sg_pair: true

traffic:
  T1: 100
  T2: 200
  T: 300
  enabled: true
  model: td
  seed: 42
  v_congestion: 10.0
  v_freeflow: 40.0

agent:
  algo: sarsa
  action_mode: neighbor_index
  policy: null

training:
  sarsa:
    num_episodes: 5000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.9
    epsilon_decay: 0.9995
