net:
  net_path: data/grid_road/grid_road.sumocfg
  max_degree: 5

fleet:
  max_speed: 110          # km/h

sumo:
  step_length: 1.0
  traffic_scale: 0       # no background traffic
  delay: 0             # ms delay for sumo-gui (ignored in quiet/print mode)

traffic:
  K: 1
  slot_duration: 60
  T: 7200.0
  enabled: true
  seed: 42
  speed_profile_type: random
  speed_step: 60.0
  v_max: 100.0
  v_min: 40.0

simulation:
  max_time: 2            # hours — SUMO wall-clock budget before forced env.reset()
  max_steps: 50         # env steps per episode before truncation
  render_mode: quiet     # quiet | print | human
  warm_up_time: 0        # seconds of SUMO warm-up before the first episode
  random_sg_pair: true   # randomise start/goal each episode

agent:
  algo: a2c             # sarsa | dqn | ppo | a2c
  action_mode: node_id  # neighbor_index (sarsa/dijkstra) | node_id (dqn/ppo/a2c)
  policy: null            # set to a policy_id string to resume/load

training:
  sarsa:
    num_episodes: 5000
    gamma: 0.99
    alpha: 0.1
    epsilon: 0.9
    epsilon_decay: 0.9995
  dqn:
    num_episodes: 5000
    gamma: 0.99
    lr: 0.001
    epsilon: 1.0
    epsilon_decay: 0.9995
    epsilon_min: 0.05
    batch_size: 64
    buffer_capacity: 50000
    target_update_freq: 500
    learn_start: 1000
    hidden_dim: 64
  ppo:
    num_iterations: 100
    num_steps: 512
    update_epochs: 4
    num_minibatches: 4
    gamma: 0.99
    gae_lambda: 0.95
    clip_coef: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lr: 2.5e-4
    anneal_lr: true
    hidden_dim: 64
    save_interval: 50
  a2c:
    num_iterations: 100
    num_steps: 512
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
    lr: 7.0e-4
    anneal_lr: false
    hidden_dim: 64
    save_interval: 50
