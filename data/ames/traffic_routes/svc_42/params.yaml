# RVT (Random Vehicle Traffic) — ames_campus_final generation parameters
# Reproduce: run the command below from data/ames/
#
#   python3 $SUMO_HOME/tools/randomTrips.py \
#     -n ames_campus_final.net.xml \
#     -e 20000 \
#     -p 5.0 \
#     --min-distance 500 \
#     --fringe-factor 5 \
#     -s 42 \
#     -o traffic_routes/svc_42/rvt_trips.xml \
#     -r traffic_routes/svc_42/rvt_routes.xml \
#     --validate

generation:
  tool: randomTrips.py        # $SUMO_HOME/tools/randomTrips.py
  sumo_version: "1.27.0"
  net_file: ames_campus_final.net.xml
  seed: 42

trips:
  end_time_s: 20000           # simulation horizon (≈5.5 h)
  period_s: 5.0               # one vehicle every 5.0 s → 4 000 total
  min_distance_m: 500.0       # ≈1–2 hops (median edge ≈ 421 m); eliminates trivial trips
  fringe_factor: 5            # 5× bias toward fringe O/D → concentrated flow on central campus roads
  validate: true              # duarouter validates routes; all 4 000 passed

outputs:
  trips: traffic_routes/svc_42/rvt_trips.xml
  routes: traffic_routes/svc_42/rvt_routes.xml

# Design rationale (DQN-favoring, free-flowing traffic)
# -------------------------------------------------------
# Network: 80 directed edges, mean length 493 m (median 421 m), range 97–1412 m.
# Real campus topology with irregular intersections — higher injection rates (p=1.2)
# caused network-wide gridlock at bottleneck nodes.
# p=5.0 keeps the network free-flowing:
#   Simultaneous vehicles: 4 000 × (107 / 20 000) ≈ 21  →  ~0.27/edge average.
# fringe-factor 5 concentrates traffic on central campus arteries (~1 vehicle/edge),
# creating persistent but non-blocking speed differentials that RL can exploit
# while static Dijkstra is forced through the higher-load corridor.
