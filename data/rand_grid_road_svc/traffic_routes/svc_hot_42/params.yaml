# SVC-HOT — rand_grid_road_svc DQN-favoring background traffic
# Reproduce:  python scripts/gen_svc_hot_traffic.py rand_grid_road_svc
# Validate:   python scripts/validate_svc_traffic.py rand_grid_road_svc
#
# Design: 12 directed hot edges selected by greedy search to maximize
# mean(t_dijkstra) - mean(t_time_optimal) on the exact 100 seed-42 eval OD pairs
# (the greedy-Dijkstra baseline path is traffic-independent, so its edge set is
# fixed). Congestion = continuous flows of slow vehicles (maxSpeed 5 m/s) forming
# un-overtakable moving bottlenecks on these 1-lane edges. With 386-806 m edges the
# per-edge congestion penalty (~120 s) dwarfs per-hop overhead — unlike the old
# rand_grid_road, where 81-212 m edges capped measured headroom at 32%.

generation:
  tool: scripts/gen_svc_hot_traffic.py
  seed: 42
  net_file: rand_grid_road_svc.net.xml

hot_edges:            # see hot_edges.txt (12 directed edges, 64/100 eval
  count: 12           # Dijkstra paths cross >= 1 of them)
  v_hot_ms: 5.0
  occupancy: 2.0
  flow_period_s: [61.0, 70.6, 57.6, 57.9, 48.4, 57.9, 54.7, 71.6, 54.0, 64.2, 54.0]

ambient:
  period_s: 5.0
  min_distance_m: 1200.0
  fringe_factor: 2

validation:           # SUMO 7200 s, edgeData 600 s windows, warm-up 300 s
  teleports: 0
  hot_edge_speed_ms: 4.89     # min 4.62, max 5.05
  other_edge_speed_ms: 23.69  # min 19.24
  t_dijkstra_mean_s: 275.3
  t_optimal_mean_s: 139.1
  headroom: 0.495             # ceiling for any traffic-aware router vs Dijkstra

recommended_config:   # config/trsp/svc/dqn_rand_grid_svc.yaml uses exactly these
  traffic.model: svc
  traffic.route_file: data/rand_grid_road_svc/traffic_routes/svc_hot_42/rvt_routes.xml
  sumo.traffic_scale: 1.0     # rates are pre-tuned; do NOT scale up
  simulation.warm_up_time: 300
