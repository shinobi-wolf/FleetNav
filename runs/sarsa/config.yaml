agent:
  algo: sarsa
  policy: sarsa
debug:
  fast_forward: 100
fleet:
  count: 1
  max_speed: 1
  range: 100000000
net:
  net_path: data/grid/grid.sumocfg
  warehouse: random
simulation:
  max_steps: 100000
  max_time: 500000
  render_fps: 30
  render_mode: human
  step_length: 1
  train: false
task:
  demand_per: 10
traffic: p:default b:default
training:
  dqn:
    batch_size: 128
    buffer_size: 10000
    end_e: 0.05
    exploration_fraction: 0.5
    gamma: 0.99
    learning_rate: 0.0025
    learning_starts: 10000
    pred_epsilon: 0.1
    start_e: 1
    target_network_frequency: 500
    tau: 1.0
    total_timesteps: 1000000
    train_frequency: 10
  sarsa:
    alpha: 0.1
    epsilon: 0.2
    epsilon_decay: 0.99
    gamma: 0.99
    num_episodes: 3000
